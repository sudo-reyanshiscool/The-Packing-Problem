<!--
    Found by David Ellsworth on December 14, 2024, including adapting and extending the technique used in the s(37) found by David W. Cantrell in September 2002.
    Improved by David Ellsworth on December 21, 2024. The result now, in a way, seems to extends the s(19) found by Robert Wainwright in late 1979, resembling one of its alternative packings found by found by David W. Cantrell in 2002.
    Made internally symmetric by David Ellsworth on December 27, 2024.
    Improved by David Ellsworth on December 31, 2025, using his modified version of Thomas Schadt's computer program, with s = 14.872531890751524.
    Improved by Tej Stead on June 16, 2026, working with Claude Fable 5.
        Source: Private communication from Tej Stead to David Ellsworth, on June 16, 2026
    Improved by Joost de Winter on August 7, 2026, working with GPT5.6-Sol and Claude Fable 5 (back and forth)
        Found independently of Ted Stead's improvement, as that was not yet published at the time this one was found.
        Source: Private communication from Joost de Winter to David Ellsworth, on August 7, 2026
        The following notes were provided:
            Improved s(206) candidate, 2026-08-07: strict-validity frontier version.
            Two-chain basin geometry (independently reached from five lineages).
            Side length reduced from 14.872531890751524 by 0.000312861725316.
            Strict validity on these exact coordinates, verified in 40-digit arithmetic:
            min pair separation 1.53e-10, min wall clearance 1.21e-10 (five orders of magnitude above coordinate rounding noise).
        The following method summary was provided:
            A sequential linear program over all 619 variables (206 centres, 206 angles, S); per near pair the best separating axis is linearised, HiGHS solves the LP, and every step is re-validated against the exact geometry.
            The key idea: at 2e-9 clearance, second-order rotation error makes a packing look locally optimal when it is not, so it optimises at looser clearance first and then tightens.
            Starting from David Ellsworth's December 31, 2025 version it takes about two minutes on one core.
    Cleaned up by David Ellsworth on August 13, 2026, to resemble the previous version (with approximated internal rotational symmetry), with no change in size.
-->
