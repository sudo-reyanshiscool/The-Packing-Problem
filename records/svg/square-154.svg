<!--
    Found by David Ellsworth on December 27, 2024.
    Made by combining two slightly modified copies of the s(41) found by Joe DeVincentis in April 2014.
        Exact polynomial root solution by David Ellsworth on June 4, 2023.
    Improvement planned by David Ellsworth on December 27, 2024 to resemble the s(179):
        - Found by David Ellsworth on December 22, 2024.
        - Inspired by the previous s(179) which combined two copies of the s(41) found by Joe DeVincentis in April 2014.
    Improved by David Ellsworth on January 3-4, 2026, using his modified version of Thomas Schadt's computer program.
        As expected, resembles the aforementioned s(179).
        David W. Cantrell, in the interim (on February 11, 2025), implemented a simpler version of the improvement than the aforementioned s(179), suggesting he had not looked at that s(179) or had forgotten about it. The improvement presented here was done independently of his, not looking at his until after this one was finished.
    Improved by Tej Stead on June 16, 2026, working with Claude Fable 5.
        Source: Private communication from Tej Stead to David Ellsworth, on June 16, 2026
    Cleaned up by David Ellsworth on September 9, 2026, to approximate rotational symmetry, with no change in size.
-->
