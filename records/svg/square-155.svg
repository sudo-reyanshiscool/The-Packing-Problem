        Improved by David Ellsworth on December 20, 2024.
            Exact polynomial root solution by David Ellsworth on December 23, 2024.
        Improved by David Ellsworth on January 18, 2026, using his modified version of Thomas Schadt's GPU simulated annealing computer program.
